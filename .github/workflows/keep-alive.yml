name: Keep Neon Awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pg
        run: npm install --no-save --no-package-lock pg

      - name: Ping the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'EOF'
          import pg from "pg";

          const url = process.env.DATABASE_URL;
          if (!url) {
            console.error("DATABASE_URL secret is not set.");
            process.exit(1);
          }

          const client = new pg.Client({ connectionString: url });
          await client.connect();
          try {
            const { rows } = await client.query("SELECT now() AS now");
            console.log("Neon is awake at " + rows[0].now);
          } finally {
            await client.end();
          }
          EOF
